# configs/safety/team_follower.yaml
# Team SO-ARM101 Pro kit follower, 12 V supply. Calibration team_follower.json (Nov 4)
arm: team_follower               # calibration id
control_hz: 30
max_step_deg: 3.0               # about 90 deg/s at 30 Hz
gripper_max_step: 5.0           # gripper uses 0-100 units
max_follow_deg: 10.0            # goal at most this far ahead of the arm
gripper_max_follow: 20.0
soft_margin_deg: 5.0            # inside the calibrated range
gripper_limits: [2, 98]
watchdog_ms: 150                # hold is written before 200 ms (E-8)
watchdog_check_ms: 10
bad_actions_to_stop: 5
voltage_v: [11.0, 12.8]             # 12 V supply, 11.9 V measured on Nov 4
temp_warn_c: 55
temp_stop_c: 65
health_every_steps: 15
bus_fail_steps_to_stop: 3
park_step_deg: 2.0
# The table is inside the calibrated range of shoulder_lift. Forward, with a
# straight elbow, the gripper is 3 cm above the table at +41.7 (Nov 20).
# Backward there is no table, but a straight arm near -100 is too heavy for the
# shoulder servo to lift again (bench case B-1, Nov 20). Our tasks are in front,
# so the arm stays within -45 behind. PARK and the rest pose ignore these limits.
# Folding forward from the upright pose, the gripper hits the table at about
# elbow_flex +70 (bench case B-1, Nov 20). +60 keeps it about 3 cm above. Only
# the rest pose (+93) folds further, and PARK ignores these limits.
# These limits hold for one joint at a time. Shoulder and elbow together can
# still reach the table, so a gripper height check is needed before policy runs.
limit_overrides: {shoulder_lift: [-45.0, 38.0], elbow_flex: [null, 60.0]}
# Whole arm straight up, measured with the live reader on Nov 20. A straight
# elbow is about -84 on this arm, and 0 is the L shape.
upright_pose_deg: {shoulder_pan: -8.7, shoulder_lift: 2.1, elbow_flex: -83.9, wrist_flex: 4.3, wrist_roll: -1.0}
# Gripper height check (S-11). Joint limits hold one joint at a time, so this
# keeps the lowest gripper point table_margin_m above the table for the whole arm.
# table_z_m and model_offsets_deg come from hardware/table_calibration.py.
# Until they are set, the safe follower refuses to start.
# Table calibration (2026-11-20, hardware/table_calibration.py).
height_check: true
table_z_m: 0.0035
table_margin_m: 0.01
model_offsets_deg: {shoulder_lift: -10.30, elbow_flex: 0.92, wrist_flex: -6.44}
rest_pose_deg: {shoulder_pan: -10.7, shoulder_lift: -103.8, elbow_flex: 93.1, wrist_flex: 71.3, wrist_roll: -4.2, gripper: 0.9}
