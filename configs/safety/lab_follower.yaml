# configs/safety/lab_follower.yaml
# Lab SO-101 follower, 5 V supply. Calibration lab_follower.json (Oct 22)
arm: lab_follower               # calibration id
control_hz: 30
max_step_deg: 3.0               # about 90 deg/s at 30 Hz
gripper_max_step: 5.0           # gripper uses 0-100 units
max_follow_deg: 10.0            # goal at most this far ahead of the arm
gripper_max_follow: 20.0
soft_margin_deg: 5.0            # inside the calibrated range
gripper_limits: [2, 98]
watchdog_ms: 150                # hold is written before 200 ms (E-8)
watchdog_check_ms: 10
bad_actions_to_stop: 5
voltage_v: [4.5, 5.5]               # 5 V supply
temp_warn_c: 55
temp_stop_c: 65
health_every_steps: 15
bus_fail_steps_to_stop: 3
park_step_deg: 2.0
rest_pose_deg: null             # written by "so101_lab.sh rest-pose"
